#para definir  donde se conecta el servidor 
server.port=8080

server.address=localhost
# Definir el formato de fecha y hora en la consola 
logging.pattern.dateformat=hh:mm
# Para eliminar comentarios basura
spring.main.banner-mode=off
# quitar el cache
spring.thymeleaf.cache=false

#MySql conexion
spring.datasource.url=jdbc:mysql://localhost:3306/apartamentosmarvin?useTimezone=true&serverTimezone=UTC

